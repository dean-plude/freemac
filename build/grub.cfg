# freemac live ISO boot menu (BIOS and UEFI)
# Like a Mac, the computer goes straight to the start-up screen: the menu stays
# hidden unless Esc (or Shift) is held while it starts. Ctrl starts Recovery.
set timeout_style=hidden
set timeout=2
set default=0

serial --unit=0 --speed=115200
terminal_input console serial
terminal_output console serial

insmod all_video

# Holding Ctrl as the computer starts goes straight to freemac Recovery.
insmod keystatus
if keystatus --ctrl; then
    set default=1
    set timeout=0
fi

menuentry "freemac @VERSION@ (live)" {
    linux /live/vmlinuz boot=live components quiet splash loglevel=3 rd.udev.log_level=3 systemd.show_status=false vt.global_cursor_default=0 plymouth.ignore-serial-consoles console=ttyS0,115200 console=tty0
    initrd /live/initrd.img
}

menuentry "freemac Recovery" --id freemac-recovery {
    linux /live/vmlinuz boot=live components quiet splash loglevel=3 systemd.show_status=false vt.global_cursor_default=0 systemd.unit=freemac-recovery.target console=ttyS0,115200 console=tty0
    initrd /live/initrd.img
}

menuentry "freemac @VERSION@ (live, safe graphics)" {
    linux /live/vmlinuz boot=live components nomodeset console=ttyS0,115200 console=tty0
    initrd /live/initrd.img
}

menuentry "freemac @VERSION@ (live, verbose boot log)" {
    linux /live/vmlinuz boot=live components console=ttyS0,115200 console=tty0
    initrd /live/initrd.img
}
