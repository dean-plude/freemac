# freemac's Terminal defaults (foot). Your own ~/.config/foot/foot.ini wins.
[main]
title=Terminal
font=DejaVu Sans Mono:size=11
pad=10x8
initial-window-size-chars=84x26

[cursor]
style=block
blink=yes

[colors]
# Black on white, like a fresh page.
background=ffffff
foreground=1d1d1f
selection-background=b5d3ff
selection-foreground=1d1d1f
regular0=1d1d1f
regular1=c4302b
regular2=2a8a3e
regular3=a86b00
regular4=2f6fd6
regular5=a33ea8
regular6=1f8a8a
regular7=bfbfc4
bright0=6e6e73
bright1=e0443e
bright2=34a853
bright3=c98a00
bright4=2f7bf5
bright5=bf5af2
bright6=2bb3b3
bright7=f5f5f7
