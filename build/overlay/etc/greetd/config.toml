# freemac live image: log the freemac user straight into the desktop.
[terminal]
vt = 7

# After logging out: Gangway, freemac's login screen, in the cage kiosk
# compositor. (The live user has no password; just press Log In.)
[default_session]
command = "cage -s -- freemac-gangway"
user = "_greetd"

[initial_session]
command = "/usr/local/bin/freemac-session"
user = "freemac"
