# Strata: freemac's window-management layer (milestone 2 configuration of
# the Wayfire compositor). Our own decoration plugin replaces Wayfire's in a
# later milestone.

[core]
plugins = alpha animate autostart command decoration expo fast-switcher foreign-toplevel gtk-shell idle move place resize scale vswipe vswitch wayfire-shell wm-actions wobbly zoom
vwidth = 4
vheight = 1
xwayland = false
background_color = \#1C1E4AFF
focus_button_with_modifiers = false
close_top_view = <super> KEY_Q | <alt> KEY_F4

[input]
xkb_layout = us
tap_to_click = true
natural_scroll = true
cursor_theme = Adwaita
cursor_size = 24
mouse_accel_profile = adaptive
touchpad_accel_profile = adaptive

[decoration]
font = Inter
title_height = 30
border_size = 2
active_color = \#E9E7EFFF
inactive_color = \#F4F3F7FF
button_order = minimize maximize close

[place]
mode = center

[animate]
open_animation = zoom
close_animation = zoom
duration = 220

[wobbly]
friction = 6
spring_k = 10

# Window overview: Ctrl+Up, Super+Tab, or a 4-finger swipe up.
[scale]
toggle = <ctrl> KEY_UP | swipe up 4
toggle_all = <super> KEY_TAB
spacing = 40
inactive_alpha = 0.85
title_overlay = all
bg_color = \#0E1030CC

# All desktops at once: Ctrl+Down or a 4-finger swipe down.
[expo]
toggle = <ctrl> KEY_DOWN | swipe down 4
background = \#0E1030FF

# Four desktops in a row: Ctrl+Left/Right or a 3-finger swipe.
[vswitch]
binding_left = <ctrl> KEY_LEFT
binding_right = <ctrl> KEY_RIGHT
with_win_left = <ctrl> <shift> KEY_LEFT
with_win_right = <ctrl> <shift> KEY_RIGHT
duration = 300

[vswipe]
enable_horizontal = true
enable_vertical = false
fingers = 3

[fast-switcher]
activate = <alt> KEY_TAB

[wm-actions]
toggle_fullscreen = <super> <ctrl> KEY_F
minimize = <super> KEY_M
toggle_showdesktop = <super> KEY_D

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot

[autostart]
autostart_wf_shell = false
background = wf-background
panel = wf-panel
dock = wf-dock
welcome = freemac-welcome
