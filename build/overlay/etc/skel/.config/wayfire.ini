# Strata: freemac's window-management layer (configuration of the Wayfire
# compositor). The ISO build swaps Wayfire's decoration and gtk-shell plugins
# for our own strata-decor and strata-shell below when it can (see strata/).

[core]
# Apps that can go either way get title bars drawn by Strata (strata-decor).
preferred_decoration_mode = server
plugins = alpha animate autostart command decoration expo foreign-toplevel gtk-shell idle ipc grid ipc-rules move place resize scale vswipe vswitch wayfire-shell wm-actions zoom
vwidth = 4
vheight = 1
xwayland = false
background_color = \#1C1E4AFF
focus_button_with_modifiers = false
close_top_view = <super> KEY_Q | <alt> KEY_F4

[input]
xkb_layout = us
tap_to_click = true
natural_scroll = true
cursor_theme = freemac
cursor_size = 24
mouse_accel_profile = adaptive
touchpad_accel_profile = adaptive

[strata-shell]
# GTK apps leave their menu bar out of the window; Topline shows it instead.
global_menus = true

[decoration]
font = Inter
title_height = 28
border_size = 4
active_color = \#E9E9ECFF
inactive_color = \#F5F5F7FF
button_order = close minimize maximize

[place]
mode = center

# Drag a window to the left or right edge to fill that half of the screen, to
# a corner for a quarter, or to the top to fill it; drag it away to get its
# size back. Super+Left/Right/Up/Down do the same from the keyboard.
[move]
enable_snap = true
snap_threshold = 12
quarter_snap_threshold = 60
enable_snap_off = true
snap_off_threshold = 24
preview_base_color = \#2F7BF540
preview_base_border = \#2F7BF5CC
preview_border_width = 2

[grid]
type = crossfade
duration = 220

[animate]
open_animation = zoom
close_animation = zoom
duration = 220

[wobbly]
friction = 6
spring_k = 10

# Window overview: Ctrl+Up, Super+Tab, or a 4-finger swipe up.
[scale]
toggle = <ctrl> KEY_UP | swipe up 4
toggle_all = <super> KEY_TAB
spacing = 40
inactive_alpha = 1.0
title_overlay = mouse
title_font_size = 13
title_position = bottom
text_color = \#FFFFFFFF
bg_color = \#00000080

# All desktops at once: Ctrl+Down or a 4-finger swipe down.
[expo]
toggle = <ctrl> KEY_DOWN | swipe down 4
background = \#0E1030FF

# Four desktops in a row: Ctrl+Left/Right or a 3-finger swipe.
[vswitch]
binding_left = <ctrl> KEY_LEFT
binding_right = <ctrl> KEY_RIGHT
with_win_left = <ctrl> <shift> KEY_LEFT
with_win_right = <ctrl> <shift> KEY_RIGHT
duration = 300

[vswipe]
enable_horizontal = true
enable_vertical = false
fingers = 3

[wm-actions]
toggle_fullscreen = <super> <ctrl> KEY_F
minimize = <super> KEY_M
toggle_showdesktop = <super> KEY_D

[idle]
# Dials > Power sets when the screen turns off; no screensaver animation.
dpms_timeout = 600
screensaver_timeout = -1

[command]
binding_terminal = <super> KEY_ENTER
command_terminal = foot
binding_seek = <super> KEY_SPACE
command_seek = freemac-seek
binding_marina = KEY_F4
command_marina = freemac-marina
binding_clips = <super> <shift> KEY_V
command_clips = freemac-clips
binding_lens_screen = KEY_SYSRQ
command_lens_screen = freemac-lens --screen
binding_lens_area = <shift> KEY_SYSRQ
command_lens_area = freemac-lens --area
binding_lens_window = <alt> KEY_SYSRQ
command_lens_window = freemac-lens --window
binding_lens_record = <ctrl> KEY_SYSRQ
command_lens_record = freemac-lens --record
binding_lens_record_area = <ctrl> <shift> KEY_SYSRQ
command_lens_record_area = freemac-lens --record-area
binding_lock = <super> KEY_L
command_lock = freemac-lock
# Tack, the app switcher: hold Alt, press Tab, let go to switch.
repeatable_binding_switcher = <alt> KEY_TAB
command_switcher = freemac-tack --next
repeatable_binding_switcher_back = <alt> <shift> KEY_TAB
command_switcher_back = freemac-tack --prev
# Volume, brightness and media keys, with a level shown by Beacon.
repeatable_binding_volume_up = KEY_VOLUMEUP
command_volume_up = freemac-keys volume-up
repeatable_binding_volume_down = KEY_VOLUMEDOWN
command_volume_down = freemac-keys volume-down
always_binding_mute = KEY_MUTE
command_mute = freemac-keys mute
always_binding_mic_mute = KEY_MICMUTE
command_mic_mute = freemac-keys mic-mute
repeatable_binding_brightness_up = KEY_BRIGHTNESSUP
command_brightness_up = freemac-keys brightness-up
repeatable_binding_brightness_down = KEY_BRIGHTNESSDOWN
command_brightness_down = freemac-keys brightness-down
always_binding_play_pause = KEY_PLAYPAUSE
command_play_pause = freemac-keys play-pause
always_binding_next = KEY_NEXTSONG
command_next = freemac-keys next
always_binding_previous = KEY_PREVIOUSSONG
command_previous = freemac-keys previous

[autostart]
autostart_wf_shell = false
backdrop = freemac-backdrop
tack = freemac-tack
beacon = freemac-beacon
topline = freemac-topline
pier = freemac-pier
welcome = freemac-welcome
latch = freemac-lock --watch
polkit = /usr/libexec/polkit-mate-authentication-agent-1
harbor = freemac-harbor --check
nightlight = freemac-nightlight
clips = wl-paste --type text --watch freemac-clips --store
icontiles = freemac-icon-tiles --user --quiet
macapps = freemac-mac-app scan
