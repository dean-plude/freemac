# Interim top bar and dock from wf-shell (MIT). Topline and Pier, freemac's
# own menu bar and dock, replace these in milestone 3.

[background]
image = /usr/share/backgrounds/freemac/dusk-tide.png
preserve_aspect = true
cycle_timeout = 0

[panel]
position = top
autohide = false
minimal_height = 28
widgets_left = menu spacing12 window-list
widgets_center = none
widgets_right = clock spacing8
clock_format = %a %b %-d   %-I:%M %p
menu_icon = /usr/share/freemac/freemac-mark.svg
menu_fuzzy_search = true
background_color = \#F4F3F7E6

[dock]
autohide = false
position = bottom
dock_height = 64
icon_height = 48
