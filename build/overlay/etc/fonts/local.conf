<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- freemac: Inter is the everyday typeface, so anything that asks for a
     plain "sans-serif" (window overview labels, older apps, web pages without
     their own font) gets it too, with DejaVu only for letters Inter lacks. -->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Inter</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>Sans</family>
    <prefer>
      <family>Inter</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
  <!-- Smooth, lightly hinted text, like a Mac's -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
  </match>
</fontconfig>
