<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 64 64">
  <!-- freemac boot mark: the rising-tide emblem as one white shape, with the
       wave cut out. Original freemac artwork, GPL-3.0-or-later. -->
  <defs>
    <mask id="cut">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M8 30.5 C18 22.5 26 36.5 36 28.5 S52 22.5 57 26.5" fill="none" stroke="#000" stroke-width="3.4" stroke-linecap="round"/>
      <path d="M6 38.5 C16 30.5 26 44.5 36 36.5 S52 30.5 58 34.5" fill="none" stroke="#000" stroke-width="2.2" stroke-linecap="round"/>
    </mask>
  </defs>
  <circle cx="32" cy="32" r="28" fill="#fff" mask="url(#cut)"/>
</svg>
