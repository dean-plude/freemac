<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Swatch: a fan of colour cards with a dropper. Original freemac artwork, GPL-3.0-or-later. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e9ef"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
    <filter id="card" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.2" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)" filter="url(#sh)"/>
  <g filter="url(#card)">
    <g transform="rotate(-38 46 98)"><rect x="34" y="26" width="24" height="76" rx="6" fill="#2f7bf5"/><circle cx="46" cy="92" r="3" fill="#fff" fill-opacity="0.8"/></g>
    <g transform="rotate(-20 46 98)"><rect x="34" y="26" width="24" height="76" rx="6" fill="#34c759"/><circle cx="46" cy="92" r="3" fill="#fff" fill-opacity="0.8"/></g>
    <g transform="rotate(-2 46 98)"><rect x="34" y="26" width="24" height="76" rx="6" fill="#ffcc00"/><circle cx="46" cy="92" r="3" fill="#fff" fill-opacity="0.8"/></g>
    <g transform="rotate(16 46 98)"><rect x="34" y="26" width="24" height="76" rx="6" fill="#ff9f0a"/><circle cx="46" cy="92" r="3" fill="#fff" fill-opacity="0.8"/></g>
    <g transform="rotate(34 46 98)"><rect x="34" y="26" width="24" height="76" rx="6" fill="#ff3b30"/><circle cx="46" cy="92" r="3" fill="#fff" fill-opacity="0.8"/></g>
  </g>
  <g transform="rotate(45 94 54)">
    <rect x="89" y="20" width="10" height="16" rx="4" fill="#3a3f47"/>
    <rect x="86" y="34" width="16" height="5" rx="2" fill="#5b616b"/>
    <path d="M90 39 h8 v26 l-4 9 l-4 -9 z" fill="#dfe8f5" stroke="#5b616b" stroke-width="1.5"/>
    <path d="M90.8 52 h6.4 v13 l-3.2 7 l-3.2 -7 z" fill="#af52de"/>
  </g>
</svg>
