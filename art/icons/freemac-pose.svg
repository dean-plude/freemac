<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Pose: a smiling face inside a camera's framing corners, with a sparkle. Original freemac artwork, GPL-3.0-or-later. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b5cff"/><stop offset="1" stop-color="#ff5c9d"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe08a"/><stop offset="1" stop-color="#ffc23d"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)" filter="url(#sh)"/>
  <!-- framing corners -->
  <g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.95">
    <path d="M24 42 V30 Q24 24 30 24 H42"/>
    <path d="M86 24 H98 Q104 24 104 30 V42"/>
    <path d="M104 86 V98 Q104 104 98 104 H86"/>
    <path d="M42 104 H30 Q24 104 24 98 V86"/>
  </g>
  <!-- the face -->
  <circle cx="64" cy="66" r="27" fill="url(#face)"/>
  <circle cx="54.5" cy="60" r="4" fill="#3b2a12"/>
  <circle cx="73.5" cy="60" r="4" fill="#3b2a12"/>
  <path d="M50 71 Q64 85 78 71" fill="none" stroke="#3b2a12" stroke-width="4.5" stroke-linecap="round"/>
  <circle cx="47" cy="70" r="4" fill="#ff8a7a" opacity="0.55"/>
  <circle cx="81" cy="70" r="4" fill="#ff8a7a" opacity="0.55"/>
  <!-- sparkle -->
  <path d="M92 36 L94.5 43.5 L102 46 L94.5 48.5 L92 56 L89.5 48.5 L82 46 L89.5 43.5 Z" fill="#fff"/>
</svg>
