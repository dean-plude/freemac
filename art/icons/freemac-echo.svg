<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <!-- Echo: a waveform of rounded bars, red in the middle, on a dark tile. Original freemac artwork, GPL-3.0-or-later. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3f4b"/><stop offset="1" stop-color="#1c1f26"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6b5e"/><stop offset="1" stop-color="#ff2d55"/>
    </linearGradient>
    <filter id="sh" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)" filter="url(#sh)"/>
  <g stroke-linecap="round" stroke-width="7">
    <g stroke="#e9ecf2" opacity="0.9">
      <path d="M26 58 V70"/><path d="M38 50 V78"/><path d="M90 46 V82"/><path d="M102 56 V72"/>
    </g>
    <g stroke="url(#red)">
      <path d="M52 38 V90"/><path d="M64 28 V100"/><path d="M76 42 V86"/>
    </g>
  </g>
</svg>
