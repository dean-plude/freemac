    <circle cx="64" cy="42" r="7" fill="#3f50b4"/>
    <rect x="59" y="56" width="10" height="44" rx="3" fill="url(#brass)"/>
    <rect x="69" y="80" width="11" height="7" rx="2" fill="url(#brass)"/>
    <rect x="69" y="91" width="8" height="7" rx="2" fill="url(#brass)"/>
