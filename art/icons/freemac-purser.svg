  </defs>
  <rect x="8" y="8" width="112" height="112" rx="24" fill="url(#bg)"/>
  <rect x="24" y="24" width="80" height="80" rx="14" fill="#ffffff" fill-opacity="0.14"/>
  <g fill="#ffffff" fill-opacity="0.35">
