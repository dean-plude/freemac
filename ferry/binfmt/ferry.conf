# Lets an Intel Mac command-line program run directly (./program) by handing
# it to Ferry. Matches a 64-bit Mach-O executable: magic 0xfeedfacf, CPU
# x86-64, any CPU subtype, file type MH_EXECUTE. Fat (universal) files are
# run with "ferry program".
:ferry:M::\xcf\xfa\xed\xfe\x07\x00\x00\x01\x00\x00\x00\x00\x02\x00\x00\x00:\xff\xff\xff\xff\xff\xff\xff\xff\x00\x00\x00\x00\xff\xff\xff\xff:/usr/bin/ferry:
